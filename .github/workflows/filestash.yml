name: Filestash

on:
  push:
    branches:
      - main

permissions:
  contents: read # to fetch code (actions/checkout)

jobs:
  update:
    name: Update Filestash
    runs-on: ubuntu-latest
    # skip on forks
    if: ${{ github.repository == 'jquery/jquery' }}
    environment: filestash
    env:
      NODE_VERSION: 24.x
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Use Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: '**/package-lock.json'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build:all

      - name: Set up SSH
        run: |
          install --directory ~/.ssh --mode 700
          base64 --decode <<< "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -t ed25519 -H "${{ secrets.FILESTASH_SERVER }}" >> ~/.ssh/known_hosts

      - name: Upload to Filestash
        run: |
          # rrsync 3.5 can't overwrite a file named as the destination, so upload to the directory
          # https://github.com/RsyncProject/rsync/issues/1107
          mkdir filestash

          cp dist/jquery.js filestash/jquery-git.js
          cp dist/jquery.min.js filestash/jquery-git.min.js
          cp dist/jquery.min.map filestash/jquery-git.min.map

          cp dist/jquery.slim.js filestash/jquery-git.slim.js
          cp dist/jquery.slim.min.js filestash/jquery-git.slim.min.js
          cp dist/jquery.slim.min.map filestash/jquery-git.slim.min.map

          cp dist-module/jquery.module.js filestash/jquery-git.module.js
          cp dist-module/jquery.module.min.js filestash/jquery-git.module.min.js
          cp dist-module/jquery.module.min.map filestash/jquery-git.module.min.map

          cp dist-module/jquery.slim.module.js filestash/jquery-git.slim.module.js
          cp dist-module/jquery.slim.module.min.js filestash/jquery-git.slim.module.min.js
          cp dist-module/jquery.slim.module.min.map filestash/jquery-git.slim.module.min.map

          rsync filestash/* filestash@"${{ secrets.FILESTASH_SERVER }}":./
